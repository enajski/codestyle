subsystems:
- name: codestyle
  code_globs:
  - src/**/*.clj
  - resources/**/*.edn
  docs_globs:
  - README.md
  test_globs: []
  expected_evidence:
  - lint
  - format
  system_category: other
  risk_class: medium
file_glob_rules:
- glob: src/**/*.clj
  subsystem: codestyle
  concern_class: code-level
  risk_note: CLI implementation changes can break downstream codestyle checks.
- glob: resources/**/*.edn
  subsystem: codestyle
  concern_class: spec-fidelity
  risk_note: Bundled formatter configuration changes can break formatting conformance.
- glob: README.md
  subsystem: codestyle
  concern_class: spec-fidelity
  risk_note: Documentation changes should stay aligned with runnable aliases and CI.
- glob: deps.edn
  subsystem: codestyle
  concern_class: code-level
  risk_note: Alias changes can break the documented codestyle commands.
- glob: .github/workflows/**/*.yml
  subsystem: codestyle
  concern_class: code-level
  risk_note: CI changes control whether Bridge evidence is enforced.
- glob: .bridge/**/*.yaml
  subsystem: codestyle
  concern_class: spec-fidelity
  risk_note: Bridge configuration changes affect required verification evidence.
project_name: codestyle
artifact_paths:
  root: .bridge/ephemeral
  evidence: .bridge/ephemeral/evidence
test_paths: []
docs_paths:
- README.md
kind: project-profile
verification_policy_path: .bridge/verification-policy.yaml
code_paths:
- src
- resources
root_path: ..
canonical_commands:
- id: lint
  kind: lint
  role: conformance
  command: clojure -M:lint
  description: Run clj-kondo through codestyle.lint
- id: basic-format
  kind: format
  role: conformance
  command: clojure -M:basic-format check
  description: Check cljfmt formatting
