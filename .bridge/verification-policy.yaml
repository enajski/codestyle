artifact: verification-policy
policy_id: codestyle-bridge-v1
bridge_path_sandbox:
  enforce?: true
  rules:
  - path_pattern: .bridge/
    access: none
rules:
- scope:
    subsystems:
    - codestyle
    change_categories:
    - code-only
    - mixed
    - docs-only
    risk_classes:
    - medium
    - high
  required_evidence:
    lint: required
    format: required
    docs_or_nl_spec: recommended
  evidence_roles:
    conformance:
    - lint
    - format
  notes:
  - Codestyle is validated by lint plus the basic-format check.
  - advanced-format is intentionally not configured as Bridge evidence yet; Bridge forbids evidence by class, so marking format forbidden would also forbid basic-format.
